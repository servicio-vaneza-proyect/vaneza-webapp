<div class="min-h-screen flex">
  <!-- Left Side - Decorative -->
  <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-pink-500 to-red-500 relative overflow-hidden">
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="text-center text-white px-8">
        <h1 class="text-4xl font-bold mb-6">"KONG"</h1>
        <p class="text-lg opacity-90 leading-relaxed">
          dev kong
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side - Login Form -->
  <div class="w-full lg:w-1/2 bg-gray-900 flex items-center justify-center p-8">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex items-center mb-8">
        <div class="w-8 h-8 bg-red-500 rounded-lg flex items-center justify-center mr-3">
          <span class="text-white font-bold text-sm">A</span>
        </div>
        <span class="text-white font-semibold">Angular Tailwind</span>
      </div>

      <!-- Header -->
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">
          Hello Again <span class="text-red-500">!</span>
        </h2>
        <p class="text-gray-400">Enter your credential to access your account.</p>
      </div>

      <!-- Google Login Button -->
      <button
        type="button"
        (click)="onGoogleLogin()"
        class="w-full bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-lg flex items-center justify-center mb-6 transition-colors"
        [disabled]="isLoading">
        <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
          <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Log in with Google
      </button>

      <div class="text-center text-gray-500 mb-6">or</div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email Field -->
        <div>
          <input
            type="email"
            formControlName="email"
            placeholder="Email address"
            class="w-full bg-gray-800 border border-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-red-500 transition-colors"
            [class.border-red-500]="email?.invalid && email?.touched">
          <div *ngIf="email?.invalid && email?.touched" class="text-red-500 text-sm mt-1">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
            class="w-full bg-gray-800 border border-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-red-500 transition-colors pr-12"
            [class.border-red-500]="password?.invalid && password?.touched">
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white">
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
            </svg>
          </button>
          <div *ngIf="password?.invalid && password?.touched" class="text-red-500 text-sm mt-1">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
            <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="flex items-center text-gray-400">
            <input
              type="checkbox"
              formControlName="rememberMe"
              class="mr-2 rounded bg-gray-800 border-gray-700 text-red-500 focus:ring-red-500">
            Remember me
          </label>
          <button
            type="button"
            (click)="onForgotPassword()"
            class="text-red-500 hover:text-red-400 text-sm">
            Forgot your password?
          </button>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-red-500 hover:bg-red-600 text-white py-3 px-4 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing In...
          </span>
        </button>
      </form>

      <!-- Sign Up Link -->
      <div class="text-center mt-6">
        <span class="text-gray-400">Not a Member yet? </span>
        <button
          type="button"
          (click)="onSwitchToRegister()"
          class="text-red-500 hover:text-red-400 font-medium">
          Sign up
        </button>
      </div>
    </div>
  </div>
</div>
